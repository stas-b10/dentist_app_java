spring.application.name=dentist

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/dentist_app
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=1234567890123456789012345678901234567890123456789012345678901234
jwt.expiration=86400000


logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.access=DEBUG
logging.level.org.springframework.security.authorization=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG